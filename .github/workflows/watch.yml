name: concert-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정으로 10~30분 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: concert-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 감시
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: 상태 저장
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "concert-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "상태 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
