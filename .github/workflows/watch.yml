name: concert-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정으로 10~30분 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      test_notify:
        description: "휴대폰 테스트 알림만 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: concert-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 감시
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: python3 watch.py

      - name: 상태 저장
        run: |
          if ! git diff --quiet -- state.json auto.json; then
            git config user.name "concert-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json auto.json
            git commit -m "상태 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
